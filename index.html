<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Запуск MVP</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.card{
    max-width:700px;
    margin:auto;
    padding:40px;
    background:white;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    text-align:center;
}

.title{
    font-size:20px;
    color:#777;
    margin-bottom:20px;
}

.days{
    font-size:72px;
    font-weight:700;
    color:#FF5630;
    line-height:1;
}

.time{
    font-size:32px;
    font-weight:600;
    margin-top:15px;
    color:#444;
}

.date{
    margin-top:35px;
    font-size:24px;
    color:#888;
}

.success{
    font-size:48px;
    font-weight:700;
    color:#FF5630;
}

</style>

</head>

<body>

<div class="card">

    <div class="title">
        🚀 До запуска MVP осталось
    </div>

    <div id="days" class="days">
        Загрузка...
    </div>

    <div id="time" class="time"></div>

    <div class="date">
        15 августа 2026
    </div>

</div>


<script>

// правильное склонение слов
function pluralize(number, one, few, many) {

    if (number % 10 === 1 && number % 100 !== 11) {
        return one;
    }

    if (
        number % 10 >= 2 &&
        number % 10 <= 4 &&
        (number % 100 < 10 || number % 100 >= 20)
    ) {
        return few;
    }

    return many;
}


function updateCountdown(){

    const launchDate = new Date("August 15, 2026 00:00:00");

    const now = new Date();

    const difference = launchDate - now;


    // если запуск уже состоялся
    if(difference <= 0){

        document.querySelector(".card").innerHTML = `
            <div class="success">
                🚀 MVP УСПЕШНО ЗАПУЩЕН
            </div>

            <div class="date">
                15 августа 2026
            </div>
        `;

        return;

    }


    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );


    const hours = Math.floor(
        (difference % (1000 * 60 * 60 * 24))
        /
        (1000 * 60 * 60)
    );


    const minutes = Math.floor(
        (difference % (1000 * 60 * 60))
        /
        (1000 * 60)
    );


    document.getElementById("days").innerHTML =
        days + " " + pluralize(
            days,
            "день",
            "дня",
            "дней"
        );


    document.getElementById("time").innerHTML =
        hours + " " + pluralize(
            hours,
            "час",
            "часа",
            "часов"
        )
        +
        " "
        +
        minutes + " " + pluralize(
            minutes,
            "минута",
            "минуты",
            "минут"
        );

}


// первый запуск
updateCountdown();


// обновление каждую минуту
setInterval(updateCountdown, 60000);


</script>

</body>
</html>
